<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign In to Apply | Acme Careers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 2.5rem;
      max-width: 24rem;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 0.5rem;
    }
    p.subtitle {
      color: #64748b;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 0.625rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.875rem;
    }
    button[type="submit"] {
      width: 100%;
      padding: 0.625rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .links {
      margin-top: 1.5rem;
      font-size: 0.875rem;
      text-align: center;
    }
    .links a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Sign In to Apply</h1>
    <p class="subtitle">Please sign in to your Acme Careers account to proceed with your application.</p>
    
    <form id="login-form" action="/login_wall/submit" method="POST">
      <div class="form-group">
        <label for="username">Email Address</label>
        <input type="email" id="username" name="username" placeholder="name@example.com" required autocomplete="username">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      
      <button type="submit" id="sign-in-btn">Sign In and Continue</button>
    </form>
    
    <div class="links">
      <p><a href="#">Forgot password?</a> &bull; <a href="#">Create account</a></p>
    </div>
  </div>
</body>
</html>
