<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Challenge Widget</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #fafafa;
    }
    .box {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 12px 16px;
      background: #ffffff;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 250px;
    }
    input[type="checkbox"] {
      width: 24px;
      height: 24px;
      cursor: pointer;
    }
    label {
      font-size: 14px;
      color: #374151;
      cursor: pointer;
      user-select: none;
    }
    .badge {
      margin-left: auto;
      font-size: 10px;
      color: #9ca3af;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="box">
    <input type="checkbox" id="challenge-checkbox">
    <label for="challenge-checkbox">Verify you are human</label>
    <div class="badge">Cloudflare<br>Turnstile</div>
  </div>
</body>
</html>
