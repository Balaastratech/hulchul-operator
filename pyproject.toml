# Repo-level dependency manifest (T-026). `pip install .` installs ONLY the
# dependencies below. The source package is src/operator, which clashes with the
# stdlib `operator` module, so it is imported as `src.operator...` and is NOT an
# installable package. Run tests from the repo root: python -m pytest src tests -q
#
# Pytest config (testpaths, markers, etc.) is configured elsewhere (Codex's
# branch); it is intentionally not declared here to avoid a merge conflict.
#
# Playwright browsers are NOT downloaded: the project drives system Chrome via
# channel="chrome", so `playwright install` is not required.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hulchul-operator"
version = "0.1.0"
description = "LangGraph job-application operator: fills forms in a real browser, pauses for human approval, submits exactly once."
requires-python = ">=3.13"
dependencies = [
    "pytest==9.1.1",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.1",
    "playwright==1.63.0",
    "httpx==0.28.1",
    "requests==2.34.2",
    "google-auth==2.59.1",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "sse-starlette==3.5.0",
]

[tool.setuptools]
# No installable packages: avoids flat-layout auto-discovery of fixtures/, src/, etc.
py-modules = []
